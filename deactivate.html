<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deactivate Account | SkillBridge SA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">SB</div>
      <span>Skill<span>Bridge</span><small>SA</small></span>
    </a>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main style="max-width:600px; margin: 60px auto; padding: 0 20px;">
    <div class="form-card">
      <h2 style="color: #d90429; margin-bottom: 15px;">Deactivate Your Account</h2>
      <p style="font-size: 0.95rem; color: #444; line-height: 1.6; margin-bottom: 20px;">
        Deactivating your account will remove your profile, upload certificates, and active listings from SkillBridge SA. This action is permanent and clears your saved session data.
      </p>

      <form id="deactivateForm">
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="confirmText">Type "DEACTIVATE" to confirm</label>
          <input id="confirmText" required placeholder="DEACTIVATE">
        </div>
        <button type="submit" class="btn" style="background: #d90429; width: 100%;">Confirm Deactivation</button>
      </form>
      <br>
      <a href="profile.html" class="link-btn" style="color: #0752aa; font-weight: 600;">← Cancel and return to profile</a>
    </div>
  </main>

  <script>
    document.getElementById("deactivateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const txt = document.getElementById("confirmText").value;
      if (txt.trim().toUpperCase() === "DEACTIVATE") {
        localStorage.clear();
        alert("Your account has been successfully deactivated.");
        window.location.href = "index.html";
      } else {
        alert("Please type DEACTIVATE correctly to confirm.");
      }
    });
  </script>
</body>
</html>
