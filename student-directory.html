<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Talent Directory - SkillBridge SA</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .directory-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .directory-header {
      margin-bottom: 30px;
    }
    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .student-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .student-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(7, 82, 170, 0.08);
      border-color: #bde0fe;
    }
    .student-card h3 {
      margin-top: 0;
      color: #0752aa;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      background: #e6f0fa;
      color: #0752aa;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .student-meta {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .student-meta strong {
      color: #222;
    }
    .student-about {
      font-size: 0.88rem;
      color: #555;
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      border-left: 3px solid #0752aa;
    }
    .student-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #0752aa;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      text-align: center;
      display: inline-block;
      border: none;
      cursor: pointer;
    }
    .btn-sm.secondary {
      background: #f1f3f5;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-sm:hover {
      opacity: 0.9;
    }
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: #fdfdfd;
      border: 2px dashed #ddd;
      border-radius: 8px;
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>
  <!-- Top Navigation Bar -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">S</span>
      <span>Skill<span>Bridge</span><small>SA</small></span>
    </a>
    <button class="menu-toggle">☰</button>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="internships.html">Internships</a>
      <a href="student-directory.html" style="color: #0752aa; font-weight:700;">Student Talent</a>
      <a href="about.html">About</a>
      <a href="profile.html">Profile</a>
      <a href="contact.html">Contact us</a>
    </nav>
    <div class="nav-actions">
      <button class="link-btn"><a href="signin.html">Sign in</a></button>
      <button class="btn btn-red"><a href="signup.html">Join SkillBridge</a></button>
    </div>
  </header>

  <main class="directory-container">
    <div class="directory-header">
      <div class="eyebrow">Scout & Connect</div>
      <h1>Student Talent Directory</h1>
      <p>Browse registered students across South African institutions, review their field of study and portfolios, and reach out regarding internships or employment opportunities.</p>
    </div>

    <!-- Student Cards Grid -->
    <div class="directory-grid" id="studentGrid">
      <!-- Dynamic cards injected via JavaScript -->
    </div>
  </main>

  <script>
    // Sample demo students to show when local storage is empty initially
    const defaultStudents = [
      {
        name: "Zanele Radebe",
        email: "zanele@example.com",
        phone: "071 234 5678",
        institution: "Tshwane University of Technology",
        year: "3rd Year",
        field: "Information Technology",
        portfolio: "https://github.com/",
        about: "Passionate front-end developer and youth advocate building community solutions using web tech."
      },
      {
        name: "Boitumelo Tsekelo",
        email: "boitumelo@example.com",
        phone: "082 345 6789",
        institution: "University of Johannesburg",
        year: "2nd Year",
        field: "Business Informatics",
        portfolio: "https://linkedin.com/",
        about: "Focused on business intelligence, data systems, and digital collaboration platforms."
      }
    ];

    // Load students from localStorage or fallback to default sample data
    let storedStudents = JSON.parse(localStorage.getItem("skillbridge-student-directory"));
    
    if (!storedStudents || storedStudents.length === 0) {
      storedStudents = defaultStudents;
      localStorage.setItem("skillbridge-student-directory", JSON.stringify(defaultStudents));
    }

    const studentGrid = document.querySelector("#studentGrid");

    if (storedStudents.length === 0) {
      studentGrid.innerHTML = `
        <div class="empty-state">
          <h3>No students registered yet</h3>
          <p>Be the first student to sign up or check back soon as talent joins the platform!</p>
          <br>
          <a href="signup.html" class="btn">Register as a Student</a>
        </div>
      `;
    } else {
      studentGrid.innerHTML = storedStudents.map(student => `
        <div class="student-card">
          <div>
            <span class="badge">${student.year || "Student"}</span>
            <h3>${student.name}</h3>
            <div class="student-meta">
              <span><strong>Institution:</strong> ${student.institution}</span>
              <span><strong>Field of Study:</strong> ${student.field}</span>
              <span><strong>Phone:</strong> ${student.phone}</span>
            </div>
            <div class="student-about">
              "${student.about}"
            </div>
          </div>
          <div class="student-actions">
            <a href="mailto:${student.email}" class="btn-sm">Email Student</a>
            ${student.portfolio && student.portfolio !== "Not provided" ? `<a href="${student.portfolio.startsWith('http') ? student.portfolio : 'https://' + student.portfolio}" target="_blank" class="btn-sm secondary">View Portfolio</a>` : ''}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
